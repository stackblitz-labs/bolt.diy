#:schema node_modules/wrangler/config-schema.json
#name = "bolt"
# wrangler.toml
name = 'boltgithubcloudflare'

main = "src/index.js" # bzw. build/index.js
compatibility_date = "2024-09-01"

# Umgebungsvariablen (nicht-sensible Daten)
[vars]
ENVIRONMENT = "production"
NODE_OPTIONS = "--max-old-space-size=8192"
#...


# Hinweis: Sensible Keys wie der GEMINI_API_KEY sollten NICHT im Klartext 
# in der wrangler.toml stehen, sondern über 'wrangler secret put GEMINI_API_KEY' 
# oder das Cloudflare Dashboard gesetzt werden.

compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-03-28"
pages_build_output_dir = "./build/client"
send_metrics = false


# ...

