name: Electron Build and Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and attach binaries to.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release (e.g., v1.0.0). Leave empty if not applicable.'
        required: false
  push:
    branches:
      - electron
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Use unsigned macOS builds for now
        node-version: ['22']
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Install Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # Build
      - name: Build Electron app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pnpm run electron:build:win --publish never
          elif [ "$RUNNER_OS" == "macOS" ]; then
            pnpm run electron:build:mac --publish never
          else
            pnpm run electron:build:linux --publish never
          fi
        shell: bash

      - name: Verify desktop artifacts exist
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) pattern='dist/*.exe' ;;
            macOS) pattern='dist/*.dmg' ;;
            Linux) pattern='dist/*.AppImage' ;;
          esac
          if ! compgen -G "$pattern" > /dev/null; then
            echo "No desktop artifact found matching $pattern"
            exit 1
          fi

      # Attach each platform's assets to the release created by the caller.
      - name: Publish desktop artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Use the supplied tag for reusable and manual runs.
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Only direct branch-push builds without a supplied release tag are drafts.
          draft: ${{ !inputs.tag && github.event_name == 'push' && github.ref_type == 'branch' }}
          name: ${{ (inputs.tag || github.ref_type == 'tag') && format('Release {0}', inputs.tag || github.ref_name) || 'Electron Release' }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
