name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Run type check
        run: pnpm run typecheck

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-

      - name: Run ESLint
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic browser tests
        run: pnpm run test:e2e:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker production build
        run: |
          echo "🐳 Testing Docker production target..."
          docker build --target bolt-ai-production -t bolt-ai:ci . --no-cache --progress=plain
          echo "✅ Production target builds successfully"

      - name: Smoke test production container
        run: |
          container_id=$(docker run -d -p 127.0.0.1:5173:5173 bolt-ai:ci)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ -o /dev/null; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1

      - name: Validate Docker development build
        run: |
          echo "🐳 Testing Docker development target..."
          docker build --target development . --no-cache --progress=plain
          echo "✅ Development target builds successfully"

      - name: Validate docker-compose configuration
        run: |
          echo "🐳 Validating docker-compose configuration..."
          docker compose config --quiet
          echo "✅ docker-compose configuration is valid"
