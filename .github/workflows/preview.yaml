name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Cancel in-progress runs on the same PR
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_NAME: preview-pr-${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check if preview deployment is configured
        id: check-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup and Build
        if: steps.check-secrets.outputs.configured == 'true'
        uses: ./.github/actions/setup-and-build
        env:
          NODE_ENV: production

      - name: Deploy preview to Cloudflare Workers
        if: steps.check-secrets.outputs.configured == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          result="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json)"
          # Wrangler prints Vite config and asset logs before the JSON object.
          preview_url="$(sed -n '/^{/,/^}$/p' <<< "$result" |
            jq -er '.preview.urls[0] | strings | select(test("^https://[^[:space:]]+$"))')"
          echo "deployment-url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Run smoke test on preview
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Checking $PREVIEW_URL"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --max-time 30 --output /dev/null -- "$PREVIEW_URL"

      - name: Preview deployment not configured
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "✅ Preview deployment is not configured for this repository"
          echo "To enable preview deployments, add the following secrets:"
          echo "- CLOUDFLARE_API_TOKEN"
          echo "- CLOUDFLARE_ACCOUNT_ID"
          echo "This is optional and the workflow will pass without it."

      - name: Add preview URL comment to PR
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previewComment = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.startsWith('🚀 Preview deployment') ||
                comment.body?.startsWith('ℹ️ Preview deployment'))
            );

            const deployUrl = process.env.PREVIEW_URL;

            let commentBody;
            if (deployUrl) {
              commentBody = `🚀 Preview deployment is ready!

              | Name | Link |
              |------|------|
              | Latest commit | ${{ github.sha }} |
              | Preview URL | ${deployUrl} |

              Built with ❤️ by [bolt.diy](https://bolt.diy)
              `;
            } else {
              commentBody = `ℹ️ Preview deployment not configured

              | Name | Info |
              |------|------|
              | Latest commit | ${{ github.sha }} |
              | Status | Preview deployment requires Cloudflare secrets |

              To enable preview deployments, repository maintainers can add:
              - \`CLOUDFLARE_API_TOKEN\` secret
              - \`CLOUDFLARE_ACCOUNT_ID\` secret

              Built with ❤️ by [bolt.diy](https://bolt.diy)
              `;
            }

            if (previewComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Record preview URL
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          printf 'Preview deployed to %s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check if preview deployment is configured
        id: check-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout base commit
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up pnpm
        if: steps.check-secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Delete Cloudflare preview
        if: steps.check-secrets.outputs.configured == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation

      - name: Remove preview comment
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' &&
                  (comment.body?.startsWith('🚀 Preview deployment') ||
                    comment.body?.startsWith('ℹ️ Preview deployment'))) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
