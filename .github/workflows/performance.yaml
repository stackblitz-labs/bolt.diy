name: Performance Budgets

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run performance tests
        run: pnpm run perf:test
        continue-on-error: true
        id: perf-tests

      - name: Build for bundle analysis
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Analyze bundle sizes
        run: pnpm run perf:analyze
        continue-on-error: true
        id: bundle-analysis

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 📊 Performance Report\n\n';
            
            // Add performance test results
            comment += '### Performance Tests\n';
            if ('${{ steps.perf-tests.outcome }}' === 'success') {
              comment += '✅ All performance tests passed\n\n';
            } else {
              comment += '⚠️ Some performance tests failed - review the logs\n\n';
            }
            
            // Add bundle analysis
            comment += '### Bundle Analysis\n';
            if ('${{ steps.bundle-analysis.outcome }}' === 'success') {
              comment += '✅ All bundles within budget\n\n';
            } else {
              comment += '❌ Some bundles exceeded budget - consider optimizing\n\n';
            }
            
            comment += '### Quick Links\n';
            comment += '- [Performance Documentation](../blob/main/PERFORMANCE.md)\n';
            comment += '- [Performance Budgets](../blob/main/.performance-budgets.json)\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if budgets exceeded
        if: steps.bundle-analysis.outcome == 'failure'
        run: |
          echo "::error::Bundle size budgets exceeded. See logs for details."
          exit 1

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: |
          pnpm dlx @lhci/cli@0.13.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  track-regressions:
    name: Track Performance Regressions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [performance-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record baseline metrics
        run: |
          mkdir -p .performance-history
          date=$(date +%Y-%m-%d)
          echo "Recording baseline for $date"
          # In a real implementation, you'd run tests and save results
          # cp test-results.json .performance-history/$date.json

      - name: Commit baseline if changed
        run: |
          git config user.name "Performance Bot"
          git config user.email "perf-bot@bolt.diy"
          git add .performance-history/ || true
          git commit -m "chore: update performance baseline [skip ci]" || true
          git push || true
