name: Deploy to Cloudflare

on:
  push:
    branches:
      - main  # oder master, je nach deinem Default-Branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'boltgithubcloudflare' # Name deiner Pages-App in Cloudflare
          directory: 'build/client'      # Output-Ordner deines Builds (z. B. dist, build, .out)
